hydra:
  run:
    dir: ${writer.output_dir}

defaults:
  - _self_
  - model: baseline

resume_from_checkpoint: null

dataset:
  tokenizer: bert-base-cased
  max_length: 180
  batch_size: 256
  max_samples: null

writer:
  project_name: shrinking-bert
  run_name: test
  output_dir: logs/${writer.project_name}/${writer.run_name}
  mode: offline # "online" | "offline"
  log_assets: false # Upload checkpoints as Comet assets (read by the HF callback)

training_args:
  output_dir: ${writer.output_dir}/checkpoints
  run_name: ${writer.run_name}
  seed: 42
  report_to: comet_ml

  # Schedule: set max_steps > 0 for iteration-based training
  num_train_epochs: 3
  max_steps: -1

  # Batching. The global batch is
  # per_device_train_batch_size * gradient_accumulation_steps * num_devices
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  dataloader_drop_last: false

  # Optimizer and schedule
  optim: adamw_torch
  learning_rate: 5.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  weight_decay: 0.01
  max_grad_norm: 0.0
  lr_scheduler_type: cosine
  warmup_steps: 0.01

  # Precision and compilation
  bf16: false
  fp16: false
  tf32: null
  torch_compile: false
  torch_compile_mode: null # "default" | "reduce-overhead" | "max-autotune"

  # Logging, evaluation, and checkpointing
  logging_steps: 100
  logging_first_step: true
  include_num_input_tokens_seen: false
  eval_strategy: steps # "no" | "steps" | "epoch"
  eval_steps: 100
  save_strategy: steps # "no" | "steps" | "epoch"
  save_steps: 100
  save_total_limit: null
  load_best_model_at_end: true
  metric_for_best_model: f1
  greater_is_better: true

  # Hugging Face Hub
  push_to_hub: false
  hub_model_id: null
  hub_strategy: every_save
  hub_private_repo: false
