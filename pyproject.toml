[project]
name = "shrinking-bert"
version = "0.1.0"
description = "Exploring model compression techniques using BERT for NER task"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "accelerate==1.15.0",
    "comet-ml==3.58.8",
    "datasets==3.6.0",
    "hydra-core==1.3.7",
    "numpy==2.5.4",
    "seqeval==1.2.2",
    "torch==2.14.1",
    "transformers==5.20.2",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",
    "jupyter==1.1.1",
    "pre-commit==4.7.0",
    "ruff==0.17.1",
    "ty==0.0.88",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["src"]

[tool.ruff.format]
quote-style = "single"

[[tool.ty.overrides]]
include = ["src/model/**"]

[tool.ty.overrides.rules]
invalid-mutable-override = "ignore"

[tool.ruff]
line-length = 100
