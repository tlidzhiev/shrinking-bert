[project]
name = "shrinking-bert"
version = "0.1.0"
description = "Exploring model compression techniques using BERT for NER task"
readme = "README.md"
authors = [
    { name = "tlidzhiev", email = "trlidzhiev@gmail.com" }
]
requires-python = "==3.15.2"
dependencies = [
    "accelerate==1.15.0",
    "comet-ml==3.58.9",
    "datasets==3.6.0",
    "hydra-core==1.3.8",
    "numpy==2.5.4",
    "seqeval==1.2.2",
    "torch==2.15.0",
    "transformers==5.22.1",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",
    "jupyter==1.1.1",
    "pre-commit==4.7.0",
    "ruff==0.17.3",
    "ty==0.0.94",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab"

[project.scripts]
train = "lab.train:main"

[tool.ruff.format]
quote-style = "single"

[tool.ruff]
line-length = 100

[[tool.ty.overrides]]
include = ["src/lab/model/**"]

[tool.ty.overrides.rules]
invalid-mutable-override = "ignore"
