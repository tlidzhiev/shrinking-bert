[project]
name = "shrinking-bert"
version = "0.1.0"
description = "Exploring model compression techniques using BERT for NER task"
readme = "README.md"
authors = [
    { name = "tlidzhiev", email = "trlidzhiev@gmail.com" }
]
requires-python = "==3.15.2"
dependencies = []

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",
    "jupyter==1.1.1",
    "pre-commit==4.7.0",
    "ruff==0.17.3",
    "ty==0.0.94",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab"

[tool.ruff.format]
quote-style = "single"

[tool.ruff]
line-length = 100
